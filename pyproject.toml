[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-converter"
version = "0.1.0"
description = "Utilities for converting raw geospatial datasets into structured CSV summaries."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
]

[project.optional-dependencies]
gis = [
  "rasterio>=1.3.0",
  "geopandas>=0.14.0",
  "GDAL>=3.6.0",
]

[project.scripts]
dataset-converter = "dataset_converter.cli:main"
dataset-pipeline = "dataset_converter.cli:pipeline_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
